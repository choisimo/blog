name: Deploy Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Deploy workers or inspect the admin Access configuration'
        type: choice
        options: [deploy, inspect-admin-access, inspect-state, export-state]
        default: deploy
      export_public_key:
        description: 'RSA public key for encrypting a migration export'
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'shared/**'
      - 'scripts/worker-deploy-matrix.mjs'
      - 'scripts/ensure-reader-image-bucket.mjs'
      - 'scripts/verify-backend-state.mjs'
      - '.github/workflows/deploy-workers.yml'

permissions:
  contents: read

jobs:
  inspect-state:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: workers/api-gateway
      - name: Inspect state transport without logging request data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/diagnose-state-transport.mjs
  export-state:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'export-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: workers/api-gateway
      - name: Export and encrypt existing D1 data
        working-directory: workers/api-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATE_EXPORT_PUBLIC_KEY: ${{ inputs.export_public_key }}
        run: |
          umask 077
          # Wrangler prints a signed plaintext download URL. Keep all its output
          # private, including on failure, rather than putting it in public logs.
          if ! npx wrangler d1 export blog-db-prod --config wrangler.d1-archive.toml --remote --output=/tmp/worker-state.sql > /tmp/state-export.log 2>&1; then
            echo 'State export failed; no plaintext data or download URLs were published.'
            exit 1
          fi
          node ../../scripts/seal-state-export.mjs /tmp/worker-state.sql /tmp/worker-state.sealed
          rm /tmp/worker-state.sql
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-worker-state
          path: /tmp/worker-state.sealed
          retention-days: 1
  inspect-admin-access:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'inspect-admin-access'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect Access applications and runtime configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/inspect-admin-access.mjs
  build-matrix:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build deploy matrix
        id: matrix
        run: echo "matrix=$(node scripts/worker-deploy-matrix.mjs)" >> "$GITHUB_OUTPUT"

  deploy-workers:
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.cacheDependencyPath }}

      - name: Install dependencies
        working-directory: workers/${{ matrix.path }}
        run: npm ci

      - name: Verify worker quality gates
        working-directory: workers/${{ matrix.path }}
        run: |
          node -e "const p=require('./package.json'); if(!p.scripts?.typecheck) process.exit(1)"
          node -e "const p=require('./package.json'); if(!p.scripts?.test) process.exit(1)"

      - name: Type-check worker
        working-directory: workers/${{ matrix.path }}
        run: npm run typecheck

      - name: Run worker tests
        working-directory: workers/${{ matrix.path }}
        run: npm run test

      - name: Verify production worker secrets
        if: ${{ matrix.hasSecrets }}
        working-directory: workers/${{ matrix.path }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REQUIRED_SECRETS_JSON: ${{ toJson(matrix.requiredSecrets) }}
        run: |
          npx wrangler secret list --env production --format json > /tmp/worker-secrets.json
          node <<'NODE'
          const fs = require('node:fs');
          const required = JSON.parse(process.env.REQUIRED_SECRETS_JSON || '[]');
          const listed = JSON.parse(fs.readFileSync('/tmp/worker-secrets.json', 'utf8'));
          const names = new Set(listed.map((item) => item.name));
          const missing = required.filter((name) => !names.has(name));
          if (missing.length > 0) {
            console.error(`Missing production Worker secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Select production state store
        id: state-store
        if: ${{ matrix.id == 'api-gateway' }}
        working-directory: workers/${{ matrix.path }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const config = readFileSync('wrangler.toml', 'utf8');
          const vars = config.split('[env.production.vars]')[1]?.split(/\n\[/)[0] || '';
          appendFileSync(process.env.GITHUB_OUTPUT, `backend=${/STATE_STORE_BACKEND\s*=\s*"origin"/.test(vars)}\n`);
          NODE

      - name: Verify Kubernetes state schema
        if: ${{ matrix.id == 'api-gateway' && steps.state-store.outputs.backend == 'true' }}
        env:
          BACKEND_ORIGIN: ${{ secrets.BACKEND_ORIGIN }}
          BACKEND_KEY: ${{ secrets.BACKEND_KEY }}
          GATEWAY_SIGNING_SECRET: ${{ secrets.GATEWAY_SIGNING_SECRET }}
        run: node scripts/verify-backend-state.mjs

      - name: Configure the verified Kubernetes origin
        if: ${{ matrix.id == 'api-gateway' && steps.state-store.outputs.backend == 'true' }}
        working-directory: workers/${{ matrix.path }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKEND_ORIGIN: ${{ secrets.BACKEND_ORIGIN }}
          BACKEND_KEY: ${{ secrets.BACKEND_KEY }}
          GATEWAY_SIGNING_SECRET: ${{ secrets.GATEWAY_SIGNING_SECRET }}
        run: |
          umask 077
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const names = ['BACKEND_ORIGIN', 'BACKEND_KEY', 'GATEWAY_SIGNING_SECRET'];
          writeFileSync('/tmp/verified-state-origin.json', JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name]]))), { mode: 0o600 });
          NODE
          npx wrangler secret bulk /tmp/verified-state-origin.json --env production
          rm /tmp/verified-state-origin.json

      - name: Apply production D1 migrations
        if: ${{ matrix.id == 'api-gateway' && steps.state-store.outputs.backend != 'true' }}
        working-directory: workers/${{ matrix.path }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Avoid running DDL on every release when the migration ledger is current.
          npx wrangler d1 execute blog-db-prod --env production --remote --command "SELECT name FROM d1_migrations" --json > /tmp/d1-applied.json
          if node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from 'node:fs';
          const responses = JSON.parse(readFileSync('/tmp/d1-applied.json', 'utf8'));
          const applied = new Set(responses.flatMap(response => response.results || []).map(row => row.name));
          const pending = readdirSync('../migrations').filter(name => name.endsWith('.sql') && !applied.has(name));
          console.log(pending.length ? `Pending migrations: ${pending.join(', ')}` : 'Migration ledger is current; no writes needed.');
          process.exit(pending.length ? 1 : 0);
          NODE
          then
            exit 0
          fi
          npx wrangler d1 execute blog-db-prod --env production --remote --command "
            CREATE TABLE IF NOT EXISTS d1_migrations(
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              name TEXT UNIQUE,
              applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL
            );
            INSERT OR IGNORE INTO d1_migrations (name)
            SELECT '0034_domain_outbox_last_attempt_at.sql'
            WHERE EXISTS (
              SELECT 1
              FROM pragma_table_info('domain_outbox')
              WHERE name = 'last_attempt_at'
            );
          "
          npm run migrations:apply:prod

      - name: Verify production D1 schema
        if: ${{ matrix.id == 'api-gateway' && steps.state-store.outputs.backend != 'true' }}
        working-directory: workers/${{ matrix.path }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute blog-db-prod --env production --remote --command "SELECT session_token_hash FROM user_sessions LIMIT 0"
          npx wrangler d1 execute blog-db-prod --env production --remote --command "SELECT key, markdown FROM site_content_blocks LIMIT 0"
          npx wrangler d1 execute blog-db-prod --env production --remote --command "SELECT scope, idempotency_key FROM idempotency_records LIMIT 0"
          npx wrangler d1 execute blog-db-prod --env production --remote --command "SELECT id, state FROM reader_image_jobs LIMIT 0"
          npx wrangler d1 execute blog-db-prod --env production --remote --command "SELECT id, status FROM translation_jobs LIMIT 0"

      - name: Ensure private reader image storage
        if: ${{ matrix.id == 'api-gateway' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-reader-image-bucket.mjs

      - name: Deploy worker
        working-directory: workers/${{ matrix.path }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
